<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pin Generator</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--fg:#eceef2;--sub:#9aa2b1;
    --accent:#ffc400;--accent-fg:#17181c;--green:#35c759;--red:#ff5a5a;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:24px 18px 60px}
  h1{font-size:22px;margin:0 0 2px}
  .muted{color:var(--sub);font-size:13px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card.full{grid-column:1 / -1}
  label{display:block;font-size:12.5px;color:var(--sub);font-weight:600;margin:0 0 6px}
  textarea,input,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    color:var(--fg);font:14px inherit;padding:10px 12px;outline:none;resize:vertical}
  textarea:focus,input:focus,select:focus{border-color:var(--accent)}
  textarea{min-height:70px}
  .row2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .btn{background:var(--accent);color:var(--accent-fg);border:none;border-radius:12px;font:700 15px inherit;padding:14px 22px;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
  .bar{display:flex;gap:12px;align-items:center;margin-top:16px;flex-wrap:wrap}
  .warn{background:#3a2a10;border:1px solid var(--accent);color:#ffd968;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:14px;display:none}
  .prog{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:14px;display:none}
  .prog > i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
  .log{margin-top:8px;font-size:12.5px;color:var(--sub);min-height:18px}
  .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .item img{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--panel2);display:block}
  .item .t{padding:8px 10px;font-size:11.5px;line-height:1.35}
  .item .t b{display:block;font-size:12px;margin-bottom:3px}
  .login{display:flex;gap:10px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:16px}
  .login > div{flex:1}
  .count-pill{font-size:13px;color:var(--sub)}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎨 Pinterest Pin Generator</h1>
  <div class="muted">Генерация идёт на сервере в фоне — можно закрыть ноутбук/вкладку, задача продолжит работать. CSV автосохраняется на R2.</div>

  <div class="warn" id="warn"></div>

  <!-- Вход -->
  <div class="login hide" id="loginBox">
    <div>
      <label>Пароль для входа</label>
      <input id="pw" type="password" placeholder="введите пароль">
    </div>
    <button class="btn" id="loginBtn">Войти</button>
  </div>

  <!-- Основной интерфейс -->
  <div id="main" class="hide">
    <div class="grid">
      <div class="card full">
        <label>Промпт для генерации (ОБЯЗАТЕЛЬНО) — что здесь напишешь, то и будет генерироваться</label>
        <textarea id="base_prompt" style="min-height:140px" placeholder="Вставь сюда свой промпт (дизайн/стиль будущих картинок)."></textarea>
      </div>
      <div class="card full">
        <label>Ключевые слова / тема (для разнообразия сюжетов — необязательно)</label>
        <textarea id="keywords" placeholder="creamy pumpkin pasta&#10;pumpkin turkey chili&#10;butternut squash chicken casserole&#10;..."></textarea>
      </div>

      <div class="card">
        <label>Параметры генерации</label>
        <label>Модель картинок</label>
        <select id="model" style="margin-bottom:12px"></select>
        <div class="row2">
          <div><label>Сколько картинок</label><input id="count" type="number" min="1" max="2000" value="10"></div>
          <div><label>Качество</label><select id="quality">
            <option value="low" selected>Low (дёшево)</option>
            <option value="medium">Medium</option>
            <option value="high">High</option></select></div>
          <div><label>Старт № файла</label><input id="start" type="number" min="1" value="1"></div>
        </div>
      </div>

      <div class="card">
        <label>Папка на R2 (session)</label>
        <input id="folder" placeholder="1-pinterest-pumpkin-recipes">
        <label style="margin-top:12px">Ссылка на цифровой продукт (колонка Link)</label>
        <input id="link" placeholder="https://...">
      </div>

      <div class="card full">
        <label>Pinterest-доски (по одной в строке — если несколько, будут чередоваться)</label>
        <textarea id="boards" placeholder="Fall Dinner Ideas&#10;Cozy Comfort Food&#10;Easy Weeknight Recipes"></textarea>
      </div>
    </div>

    <div class="bar">
      <button class="btn" id="go">Запустить генерацию</button>
      <button class="btn ghost" id="dl" disabled>Скачать CSV</button>
      <button class="btn ghost" id="forget" class="hide">Новая сессия</button>
      <span class="count-pill" id="pill"></span>
    </div>

    <div class="prog" id="prog"><i></i></div>
    <div class="log" id="logline"></div>
    <div class="items" id="items"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let PW = '';           // пароль
let JOB = '';          // текущий job_id
let rendered = 0;      // сколько строк уже отрисовано
let csvUrl = '';
let polling = null;

function hdr(){ return PW ? {'X-Admin-Key': PW, 'Content-Type':'application/json'} : {'Content-Type':'application/json'}; }

// ---- старт: проверка конфигурации и входа ----
fetch('/api/config-check').then(r=>r.json()).then(d=>{
  if(!d.ok){
    const w=$('#warn'); w.style.display='block';
    w.textContent='Не заданы ключи: '+d.missing.join(', ')+'. Проверь .env (локально) или переменные окружения сервиса.';
  }
  const sel=$('#model');
  (d.models||[]).forEach(m=>{const o=document.createElement('option');o.value=m.id;o.textContent=m.label;
    if(m.id===d.default_model)o.selected=true;sel.appendChild(o);});

  PW = localStorage.getItem('zpw_pw')||'';
  if(d.auth_required && !PW){ $('#loginBox').classList.remove('hide'); }
  else { enterApp(); }
});

$('#loginBtn').onclick = ()=>{
  const pw=$('#pw').value.trim();
  fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})})
    .then(r=>r.json()).then(d=>{
      if(d.ok){ PW=pw; try{localStorage.setItem('zpw_pw',pw);}catch(e){} $('#loginBox').classList.add('hide'); enterApp(); }
      else alert('Неверный пароль');
    });
};

function enterApp(){
  $('#main').classList.remove('hide');
  // переподключение к запущенной задаче
  JOB = localStorage.getItem('zpw_job')||'';
  if(JOB){ $('#logline').textContent='Переподключаюсь к запущенной задаче…'; startPolling(); }
}

function addRow(row){
  const el=document.createElement('div'); el.className='item';
  el.innerHTML='<img loading="lazy" src="'+row["Media URL"]+'"><div class="t"><b>'+esc(row["Title"])+'</b>'+esc((row["Description"]||'').slice(0,90))+'…</div>';
  $('#items').appendChild(el);
}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

function startPolling(){
  $('#prog').style.display='block'; $('#go').disabled=true;
  if(polling) clearInterval(polling);
  const tick=()=>{
    fetch('/api/status?job_id='+encodeURIComponent(JOB)+'&after='+rendered,{headers:hdr()})
      .then(r=>{ if(r.status===404){ stopJob('Задача не найдена (сервер мог перезапуститься). Готовый CSV — на R2.'); return null;} return r.json(); })
      .then(d=>{
        if(!d) return;
        (d.rows||[]).forEach(addRow); rendered += (d.rows||[]).length;
        const pct = d.total? Math.round(d.done/d.total*100):0;
        $('#prog > i').style.width=pct+'%';
        $('#pill').textContent=d.done+' / '+d.total+(d.errors?('  · ошибок '+d.errors):'');
        $('#logline').textContent=d.stage||'';
        if(d.csv_url){ csvUrl=d.csv_url; $('#dl').disabled=false; }
        if(d.status==='done' || d.status==='error'){ stopJob(); $('#go').disabled=false; }
      }).catch(()=>{});
  };
  tick(); polling=setInterval(tick,2500);
}
function stopJob(msg){ if(polling){clearInterval(polling);polling=null;} if(msg)$('#logline').textContent=msg; }

$('#go').onclick = ()=>{
  const payload={
    base_prompt:$('#base_prompt').value.trim(),
    keywords:$('#keywords').value.trim(),
    count:parseInt($('#count').value||'1',10),
    quality:$('#quality').value,
    image_model:$('#model').value,
    start:parseInt($('#start').value||'1',10),
    folder:$('#folder').value.trim(),
    boards:$('#boards').value,
    link:$('#link').value.trim(),
  };
  if(!payload.base_prompt){ alert('Вставь промпт в обязательное поле «Промпт для генерации»'); return; }
  if(!payload.folder){ alert('Укажи папку на R2 (session)'); return; }

  $('#items').innerHTML=''; rendered=0; csvUrl=''; $('#dl').disabled=true;
  $('#logline').textContent='Запускаю задачу на сервере…';
  fetch('/api/start',{method:'POST',headers:hdr(),body:JSON.stringify(payload)})
    .then(r=>r.json()).then(d=>{
      if(d.error){ alert(d.error); return; }
      JOB=d.job_id; try{localStorage.setItem('zpw_job',JOB);}catch(e){}
      startPolling();
    }).catch(e=>{ $('#logline').textContent='Ошибка запуска: '+e.message; });
};

$('#dl').onclick = ()=>{
  // качаем автосохранённый CSV с R2, либо собранный сервером
  const url = csvUrl || ('/api/download?job_id='+encodeURIComponent(JOB)+(PW?('&key='+encodeURIComponent(PW)):''));
  window.open(url,'_blank');
};
</script>
</body>
</html>
